<!-- ====== NAVBAR COMPARTIDA ====== -->
<nav class="navbar navbar-expand-lg bn-navbar">
  <div class="container-fluid px-3">
    <!-- Marca -->
    <a class="navbar-brand" routerLink="/" (click)="closeNav()">
      <span class="brand-icon"><i class="bi bi-book-half"></i></span>
      BiblioNexus
    </a>

    <!-- Botón colapsable -->
    <button class="navbar-toggler border-0 shadow-none d-lg-none" type="button" (click)="toggleNav()"
      [attr.aria-expanded]="!isNavCollapsed" aria-label="Abrir menú de navegación">
      <i class="bi" [ngClass]="isNavCollapsed ? 'bi-list' : 'bi-x-lg'"></i>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isNavCollapsed" id="navGlobal">
      <!-- Indicador decorativo táctil móvil -->
      <div class="mobile-menu-handle d-lg-none"></div>

      <!-- Navegación -->
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
            (click)="closeNav()">
            <span class="nav-icon-badge"><i class="bi bi-house"></i></span>
            <span class="nav-link-text">Inicio</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/catalogo" routerLinkActive="active" (click)="closeNav()">
            <span class="nav-icon-badge"><i class="bi bi-grid"></i></span>
            <span class="nav-link-text">Catálogo</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contacto" routerLinkActive="active" (click)="closeNav()">
            <span class="nav-icon-badge"><i class="bi bi-envelope"></i></span>
            <span class="nav-link-text">Contáctanos</span>
          </a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn">
          <a class="nav-link" routerLink="/alumnos" routerLinkActive="active" (click)="closeNav()">
            <span class="nav-icon-badge"><i class="bi bi-person-workspace"></i></span>
            <span class="nav-link-text">Dashboard</span>
          </a>
        </li>
      </ul>

      <!-- Búsqueda -->
      <form class="d-flex align-items-center me-lg-3 bn-search" (ngSubmit)="onSearch()">
        <button type="submit" class="search-submit-btn" aria-label="Buscar libro">
          <i class="bi bi-search search-icon"></i>
        </button>
        <input type="search" placeholder="Buscar título, autor..." [(ngModel)]="searchTerm" name="search"
          (input)="onSearchInput()" id="navbar-search-input" autocomplete="off">
      </form>

      <!-- Botones o Perfil de Usuario -->
      <div class="d-flex gap-2 align-items-center bn-nav-actions">
        <!-- Si NO está logueado -->
        <ng-container *ngIf="!isLoggedIn">
          <a class="btn btn-bn-secondary btn-sm" routerLink="/login" (click)="closeNav()">Iniciar Sesión</a>
          <a class="btn btn-bn-primary btn-sm" routerLink="/registro" (click)="closeNav()">Registrarse</a>
        </ng-container>

        <!-- Si SÍ está logueado -->
        <ng-container *ngIf="isLoggedIn">
          <!-- Si es admin -->
          <a *ngIf="isAdmin" class="btn btn-bn-gold btn-sm me-lg-2" routerLink="/registrar-libro" (click)="closeNav()">
            <i class="bi bi-plus-circle me-1"></i>Registrar Libro
          </a>

          <!-- Perfil Desplegable -->
          <div class="nav-item dropdown user-profile w-100-mobile">
            <a class="nav-link d-flex align-items-center gap-2 text-dark user-profile-trigger" style="cursor: pointer;"
              id="navbarUserDropdown" role="button" aria-expanded="false" (click)="toggleMenu()">
              <div class="avatar-container position-relative">
                <ng-container *ngIf="usuario.fotoPerfil !== 'assets/images/default-avatar.png'">
                  <img [src]="usuario.fotoPerfil" alt="Avatar"
                    class="user-avatar rounded-circle object-fit-cover shadow-sm">
                </ng-container>
                <ng-container *ngIf="usuario.fotoPerfil === 'assets/images/default-avatar.png'">
                  <i class="bi bi-person-circle fs-4 text-primary"></i>
                </ng-container>
                <label class="upload-badge" title="Cambiar foto">
                  <i class="bi bi-camera-fill"></i>
                  <input type="file" class="d-none" accept="image/*" (change)="onFileSelected($event)">
                </label>
              </div>
              <span class="fw-semibold user-name-label">Hola, {{ usuario.nombre.split(' ')[0] }}</span>
              <i class="bi bi-chevron-down ms-1 fs-6 text-muted" style="font-size: 0.8rem;"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-bn border-0 mt-2" [class.show]="isMenuOpen"
              aria-labelledby="navbarUserDropdown">
              <li>
                <div class="dropdown-header text-muted">Matrícula: {{ usuario.matricula }}</div>
              </li>
              <li><a class="dropdown-item" routerLink="/cuenta" (click)="closeNav(); isMenuOpen=false"><i
                    class="bi bi-person me-2"></i> Mi Perfil</a></li>
              <li><a class="dropdown-item" routerLink="/cuenta" fragment="ajustes"
                  (click)="closeNav(); isMenuOpen=false"><i class="bi bi-gear me-2"></i>
                  Configuración</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li><button class="dropdown-item text-danger" (click)="cerrarSesion()"><i
                    class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión</button></li>
            </ul>
          </div>
        </ng-container>

      </div>
    </div>
  </div>
</nav>
