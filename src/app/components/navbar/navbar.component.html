<!-- ====== NAVBAR COMPARTIDA ====== -->
<nav class="navbar navbar-expand-lg bn-navbar">
  <div class="container-fluid px-3">
    <!-- Marca -->
    <a class="navbar-brand" routerLink="/">
      <span class="brand-icon"><i class="bi bi-book-half"></i></span>
      BiblioNexus
    </a>

    <!-- Botón colapsable -->
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navGlobal">
      <i class="bi bi-list fs-4" style="color:var(--primary)"></i>
    </button>

    <div class="collapse navbar-collapse" id="navGlobal">
      <!-- Navegación -->
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <i class="bi bi-house me-1"></i>Inicio
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/catalogo" routerLinkActive="active">
            <i class="bi bi-grid me-1"></i>Catálogo
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contactanos" routerLinkActive="active">
            <i class="bi bi-grid me-1"></i>Contactanos
          </a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn">
          <a class="nav-link" routerLink="/alumnos" routerLinkActive="active">
            <i class="bi bi-person-workspace me-1"></i>Dashboard
          </a>
        </li>
      </ul>

      <!-- Búsqueda -->
      <form class="d-flex align-items-center me-3 bn-search" (ngSubmit)="onSearch()">
        <i class="bi bi-search search-icon"></i>
        <input type="search" placeholder="Buscar título, autor..." [(ngModel)]="searchTerm" name="search">
      </form>

      <!-- Botones o Perfil de Usuario -->
      <div class="d-flex gap-2 align-items-center">
        <!-- Si NO está logueado -->
        <ng-container *ngIf="!isLoggedIn">
          <a class="btn btn-bn-secondary btn-sm" routerLink="/login">Iniciar Sesión</a>
          <a class="btn btn-bn-primary btn-sm" routerLink="/registro">Registrarse</a>
        </ng-container>

        <!-- Si SÍ está logueado -->
        <ng-container *ngIf="isLoggedIn">
          <!-- Si es admin -->
          <a *ngIf="isAdmin" class="btn btn-bn-gold btn-sm me-2" routerLink="/registrar-libro">
            <i class="bi bi-plus-circle me-1"></i>Registrar Libro
          </a>

          <!-- Perfil Desplegable -->
          <div class="nav-item dropdown user-profile">
            <a class="nav-link d-flex align-items-center gap-2 text-dark" style="cursor: pointer;"
              id="navbarUserDropdown" role="button" aria-expanded="false" (click)="toggleMenu()">
              <div class="avatar-container position-relative">
                <ng-container *ngIf="usuario.fotoPerfil !== 'assets/images/default-avatar.png'">
                  <img [src]="usuario.fotoPerfil" alt="Avatar" class="user-avatar rounded-circle object-fit-cover shadow-sm">
                </ng-container>
                <ng-container *ngIf="usuario.fotoPerfil === 'assets/images/default-avatar.png'">
                  <i class="bi bi-person-circle fs-4 text-primary"></i>
                </ng-container>
                <label class="upload-badge" title="Cambiar foto">
                  <i class="bi bi-camera-fill"></i>
                  <input type="file" class="d-none" accept="image/*" (change)="onFileSelected($event)">
                </label>
              </div>
              <span class="fw-semibold d-none d-lg-inline">Hola, {{ usuario.nombre.split(' ')[0] }}</span>
              <i class="bi bi-chevron-down ms-1 fs-6 d-none d-lg-inline text-muted" style="font-size: 0.8rem;"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-bn border-0 mt-2" [class.show]="isMenuOpen" aria-labelledby="navbarUserDropdown">
              <li>
                <div class="dropdown-header text-muted">Matrícula: {{ usuario.matricula }}</div>
              </li>
              <li><a class="dropdown-item" routerLink="/cuenta"><i class="bi bi-person me-2"></i> Mi Perfil</a></li>
              <li><a class="dropdown-item" routerLink="/cuenta" fragment="ajustes"><i class="bi bi-gear me-2"></i>
                  Configuración</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li><button class="dropdown-item text-danger" (click)="cerrarSesion()"><i
                    class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión</button></li>
            </ul>
          </div>
        </ng-container>

      </div>
    </div>
  </div>
</nav>
