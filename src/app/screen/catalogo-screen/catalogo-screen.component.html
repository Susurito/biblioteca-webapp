<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-3">
  <a class="navbar-brand fw-bold" routerLink="/">BibliApp</a>

  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarContent">

    <!-- Menú de navegación -->
    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
      <li class="nav-item">
        <a class="nav-link" routerLink="/">Inicio</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" routerLink="/catalogo">Catálogo</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/contacto">Contacto</a>
      </li>
    </ul>

    <!-- Barra de búsqueda -->
    <form class="d-flex me-3" (ngSubmit)="onSearch()">
      <input class="form-control me-2" type="search" placeholder="Buscar libros..." [(ngModel)]="searchTerm" name="search">
      <button class="btn btn-outline-primary" type="submit">Buscar</button>
    </form>

    <!-- Botones de cuenta y admin -->
    <div>
      <a class="btn btn-primary me-2" routerLink="/cuenta" *ngIf="isLoggedIn">Cuenta</a>
      <a class="btn btn-success me-2" routerLink="/registrar-libro" *ngIf="isAdmin">Registrar Libro</a>
    </div>

  </div>
</nav>

<!-- Contenedor principal -->
<div class="container-fluid mt-4">
  <div class="row">
    <!-- Filtro lateral -->
    <aside class="col-12 col-md-3 col-lg-2 bg-light border-end p-3 vh-100 overflow-auto">
      <h5 class="fw-bold mb-3">Filtro</h5>
      
      <div class="mb-3">
        <label class="form-label">Género</label>
        <select class="form-select" [(ngModel)]="selectedGenero" (change)="aplicarFiltro()">
          <option value="Todos">Todos</option>
          <option *ngFor="let g of generos">{{ g }}</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Autor</label>
        <input type="text" class="form-control" [(ngModel)]="autorBusqueda" placeholder="Nombre del autor" (input)="aplicarFiltro()">
      </div>

      <div class="mb-3">
        <label class="form-label">Disponibilidad</label>
        <select class="form-select" [(ngModel)]="disponibilidad" (change)="aplicarFiltro()">
          <option>Todos</option>
          <option>Disponible</option>
          <option>No disponible</option>
        </select>
      </div>

      <button class="btn btn-primary w-100 mt-2" (click)="aplicarFiltro()">Aplicar filtros</button>
    </aside>

    <!-- Contenido principal -->
    <main class="col-12 col-md-9 col-lg-10 p-4">
      <h2 class="text-center mb-4 text-primary fw-bold">Catálogo de Libros</h2>

      <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-4" *ngFor="let libro of librosFiltrados">
          <div class="card h-100 shadow-sm">
            <img [src]="getPortada(libro)" class="card-img-top" style="max-height: 300px; object-fit: cover;">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">{{ libro.titulo }}</h5>
              <p class="card-text">Autor: {{ libro.autor }}</p>
              <p class="card-text">Género: {{ libro.genero }}</p>

              <button class="btn btn-outline-primary mt-auto" (click)="verDetalles(libro)">
                Ver Detalles
              </button>

              <button 
                class="btn btn-success mt-2" 
                [disabled]="!libro.disponible || libro.id === undefined"
                (click)="libro.id !== undefined && solicitarPrestamo(libro.id)">
                Solicitar Préstamo
              </button>
            </div>
          </div>
        </div>
      </div>

      <p *ngIf="librosFiltrados.length === 0" class="text-center mt-5 text-secondary">
        No se encontraron libros.
      </p>
    </main>
  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-4 mt-5">
  <div class="container">
    <p class="mb-1">Contacto: +52 123 456 7890</p>
    <p class="mb-2">Email: contacto@biblioteca.com</p>
    <div>
      <a href="#" class="text-white me-3"><i class="bi bi-facebook"></i></a>
      <a href="#" class="text-white me-3"><i class="bi bi-twitter"></i></a>
      <a href="#" class="text-white me-3"><i class="bi bi-instagram"></i></a>
    </div>
  </div>
</footer>
