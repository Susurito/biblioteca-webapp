<div class="container mt-4">
  <h2>Registrar Libro</h2>
  <form [formGroup]="libroForm" (ngSubmit)="registrarLibro()">
    <div class="mb-3">
      <label class="form-label">Título</label>
      <input type="text" class="form-control" formControlName="titulo">
    </div>

    <div class="mb-3">
      <label class="form-label">Autor</label>
      <input type="text" class="form-control" formControlName="autor">
    </div>

    <div class="mb-3">
      <label class="form-label">Género</label>
      <input type="text" class="form-control" formControlName="genero">
    </div>

    <div class="mb-3">
      <label class="form-label">Detalles</label>
      <textarea class="form-control" formControlName="detalles"></textarea>
    </div>

    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" formControlName="disponible">
      <label class="form-check-label">Disponible</label>
    </div>

    <button type="submit" class="btn btn-primary">Registrar Libro</button>
  </form>
</div>
